services:
  postgres:
    image: postgres:16-alpine
    container_name: oncocollab-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oncocollab
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oncocollab-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d oncocollab"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oncocollab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - oncocollab-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: oncocollab-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - oncocollab-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: oncocollab-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: oncovision
    volumes:
      - mongodb_data:/data/db
    networks:
      - oncocollab-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  oncovision-api:
    build:
      context: ./OncoVision/rest
      dockerfile: Dockerfile
    container_name: oncocollab-oncovision-api
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      ENVIRONMENT: dev
      HOST: 0.0.0.0
      PORT: 8000
      S3_HOST: http://minio
      S3_PORT: 9000
      S3_USER: minioadmin
      S3_PASSWORD: minioadmin123
      S3_REGION: us-east-1
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: admin
      MONGO_PASSWORD: password123
      MONGO_DATABASE: oncovision
    command: bash -c "pip install sqlmodel --quiet && fastapi run main.py --port 8000"
    depends_on:
      minio:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - oncocollab-network

  rest-api:
    build:
      context: ./rest-api
      dockerfile: Dockerfile.dev
    container_name: oncocollab-rest-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://admin:password123@postgres:5432/oncocollab
      REDIS_URL: redis://redis:6379
      FORMS_API_URL: ${FORMS_API_URL:-http://olga-api:9091}
      FORM_COMPLETION_API_URL: http://completion-formulaire:8001
      TRANSCRIPTION_WS_URL: ws://transcription-api:8000
      ONCOVISION_API_URL: http://oncovision-api:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oncocollab-network
    volumes:
      - ./rest-api/src:/app/src
      - ./rest-api/prisma:/app/prisma
      - ./rest-api/prisma.config.ts:/app/prisma.config.ts
      - ./certs:/app/certs:ro
      - uploads_data:/app/uploads

  websocket:
    build:
      context: ./websocket
      dockerfile: Dockerfile.dev
    container_name: oncocollab-websocket-dev
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://admin:password123@postgres:5432/oncocollab
      REDIS_URL: redis://redis:6379
      API_URL: ${API_URL:-http://rest-api:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rest-api:
        condition: service_started
    networks:
      - oncocollab-network
    volumes:
      - ./websocket/src:/app/src
      - ./websocket/prisma:/app/prisma
      - ./websocket/prisma.config.ts:/app/prisma.config.ts
      - ./certs:/app/certs:ro

  visio-app:
    build:
      context: ./visio-app
      dockerfile: Dockerfile.dev
    container_name: oncocollab-visio-app-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${API_URL}
      - VITE_WS_URL=${WEBSOCKET_URL}
      - VITE_REPORT_API_URL=${REPORT_API_URL:-}
      - VITE_TRANSCRIPTION_WS_URL=${VITE_TRANSCRIPTION_WS_URL:-ws://localhost:8002}
      - VITE_GROQ_API_KEY=${VITE_GROQ_API_KEY:-}
      - VITE_STUN_URL=${VITE_STUN_URL:-stun:stun.l.google.com:19302}
      - VITE_TURN_URL=${VITE_TURN_URL:-turn:localhost:3478}
      - VITE_TURN_USERNAME=${VITE_TURN_USERNAME:-admin}
      - VITE_TURN_PASSWORD=${VITE_TURN_PASSWORD:-password}
    depends_on:
      - rest-api
      - websocket
      - generation_rapport
    networks:
      - oncocollab-network
    volumes:
      - ./visio-app/src:/app/src
      - ./visio-app/components:/app/components
      - ./visio-app/public:/app/public
      - ./visio-app/types:/app/types
      - ./visio-app/vite.config.ts:/app/vite.config.ts
      - ./OncoVision/app/src:/app/oncovision-src
      - /app/node_modules

  generation_rapport:
    build:
      context: ./generation_rapport
      dockerfile: Dockerfile
    container_name: oncocollab-generation-rapport-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ORGANIZATION_NAME=${ORGANIZATION_NAME:-OncoCollab}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - ./generation_rapport:/app
      - ./generation_rapport/output:/app/output
      - ./certs:/app/certs:ro
    networks:
      - oncocollab-network

  completion-formulaire:
    build:
      context: ./Completion_formulaire
      dockerfile: DockerFile
    container_name: oncocollab-comqpletion-formulaire-dev
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      # Gardé pour pouvoir repasser sur Ollama via LLM_PROVIDER=ollama
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - oncocollab-network

  transcription-api:
    build:
      context: ./new_transcription/transcription_API_global
      dockerfile: Dockerfile.api_websocket
    container_name: oncocollab-transcription-api-dev
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-mistral}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - oncocollab-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  coturn:
    image: coturn/coturn
    container_name: oncocollab-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "50000-50020:50000-50020/udp"
    environment:
      - EXTERNAL_IP=${EXTERNAL_IP:-127.0.0.1}
    command:
      - -n
      - --log-file=stdout
      - --min-port=50000
      - --max-port=50020
      - --listening-ip=0.0.0.0
      - --external-ip=${EXTERNAL_IP:-127.0.0.1}
      - --realm=oncocollab
      - --user=admin:password
      - --lt-cred-mech
    networks:
      - oncocollab-network

  # =====================
  # Olga Services
  # =====================
  olga-mysql:
    image: mysql:latest
    container_name: olga-mysql
    env_file:
      - ./olga/.env.mysql
    ports:
      - "3306:3306"
    volumes:
      - olga_mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - oncocollab-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  olga-phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: olga-phpmyadmin
    ports:
      - "81:80"
    environment:
      PMA_HOST: olga-mysql
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      olga-mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - oncocollab-network

  olga-api:
    image: kirito140/olga-backend:latest
    container_name: olga-api
    ports:
      - "9091:9091"
    env_file:
      - ./olga/.env.back
    depends_on:
      olga-mysql:
        condition: service_healthy
    volumes:
      - ./olga/config/apiKey.json:/app/config/apiKey.json:ro
    restart: unless-stopped
    networks:
      - oncocollab-network

  olga-admin:
    build:
      context: ./olga
      dockerfile: Dockerfile.admin
    container_name: olga-admin
    ports:
      - "8081:80"
    env_file:
      - ./olga/.env.front
    volumes:
      - ./olga/config/config.json:/usr/share/nginx/html/config/config.json:ro
    depends_on:
      - olga-api
    restart: unless-stopped
    networks:
      - oncocollab-network

  olga-designer:
    build:
      context: ./olga
      dockerfile: Dockerfile.designer
    container_name: olga-designer
    ports:
      - "8080:80"
    env_file:
      - ./olga/.env.front
    volumes:
      - ./olga/config/config.json:/usr/share/nginx/html/config/config.json:ro
    depends_on:
      - olga-api
    restart: unless-stopped
    networks:
      - oncocollab-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  olga_mysql_data:
    driver: local
  uploads_data:
    driver: local
  minio_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  oncocollab-network:
    driver: bridge
